name: Generate Trophies

on:
  schedule:
    - cron: '0 0 * * *'   # runs daily at midnight UTC
  workflow_dispatch:       # lets you trigger it manually from the Actions tab

jobs:
  trophies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate trophies SVG
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_USER: AlokNayak24
        run: node scripts/generate-trophies.mjs

      - name: Commit & Push
        run: |
          git config user.name AlokNayak24
          git config user.email aloknayak2013@gmail.com
          git add github-trophies.svg
          if git commit -m "Update trophies"; then
            git push
          fi
