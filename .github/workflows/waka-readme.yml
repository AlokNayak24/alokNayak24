name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TOTAL: True
          AUTHOR_NAME: AlokNayak24
          AUTHOR_EMAIL: aloknayak2013@gmail.com
          COMMITTER_NAME: AlokNayak24
          COMMITTER_EMAIL: aloknayak2013@gmail.com
