name: Generate Streak Stats

on:
  schedule:
    - cron: '0 0 * * *'   # runs daily at midnight UTC
  workflow_dispatch:       # lets you trigger it manually from the Actions tab

jobs:
  streak-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate streak stats SVG
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_USER: AlokNayak24
        run: node scripts/generate-streak-stats.mjs

      - name: Commit & Push
        run: |
          git config user.name AlokNayak24
          git config user.email aloknayak2013@gmail.com
          git add github-streak-stats.svg
          if git commit -m "Update streak stats"; then
            for i in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main && git push && break
              sleep 3
            done
          fi
